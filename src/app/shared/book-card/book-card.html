<a
  [routerLink]="['/books', book().id]"
  class="group flex h-full flex-col gap-3 rounded-lg border border-stone-200 bg-white p-3 transition hover:border-stone-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-stone-900"
>
  <div class="flex aspect-2/3 items-center justify-center overflow-hidden rounded bg-stone-100">
    @if (cover(); as coverSrc) {
      <img [src]="coverSrc" alt="" loading="lazy" class="h-full w-full object-cover" />
    } @else {
      <span class="px-2 text-center text-xs text-stone-500">No cover</span>
    }
  </div>

  <div class="flex flex-col gap-1">
    <h3 class="text-sm font-medium leading-snug group-hover:underline">
      {{ book().title }}
    </h3>
    <p class="text-xs text-stone-600">{{ authorLine() }}</p>
    @if (book().firstPublishYear; as year) {
      <p class="text-xs text-stone-500">{{ year }}</p>
    }
  </div>
</a>
