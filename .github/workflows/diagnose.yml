# TEMPORARY. Answers one question: why does auth.service.spec.ts fail on Linux
# and pass on Windows? Delete this file once the cause is known.
name: Diagnose

on: pull_request

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: How does Node resolve the module?
        run: |
          node -e "console.log('require:', require.resolve('firebase/auth'))"
          node --input-type=module -e "console.log('import:', (await import.meta.resolve('firebase/auth')))"

      # The decisive one. If the file passes alone, another spec is loading the
      # real module first and the mock arrives too late. If it fails alone, the
      # module identity itself differs and no ordering is involved.
      - name: The spec on its own
        run: npm test -- --watch=false auth.service
        continue-on-error: true

      - name: The whole suite, in execution order
        run: npm test -- --watch=false --reporter=verbose
        continue-on-error: true
